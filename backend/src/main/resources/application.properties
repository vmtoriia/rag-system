spring.application.name=food-rag

# Database: the same values as in ../docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:15432/rag
spring.datasource.username=rag
spring.datasource.password=rag

# Port of this application (8080 is used by another program on this computer)
server.port=8081

# Ollama (local models). Questions are embedded with bge-m3, the same model the Python indexer used for the products.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=bge-m3

# Show the reason of an error (for example "Unknown allergen") in the error response
server.error.include-message=always
